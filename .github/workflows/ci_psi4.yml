name: tests-psi4

# Psi4 is not on PyPI, so this workflow installs it with conda and runs the psi4 tests, which the pip-based workflow
# (tests.yml) skips. The other tests run there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest-psi4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        # Login shell, so that the conda environment is active in every step
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: psi4_env
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install Psi4
        run: conda install -y psi4 numpy scipy pytest
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Check Psi4
        run: python -c "import psi4; print(psi4.__version__)"
      - name: Run tests
        run: python -m pytest -v tests/test_psi4_interface.py
